# Preteaporter Docker Compose
# Multi-agent A2A system with WebSocket orchestration

services:
  # Chat Orchestrator - WebSocket server on port 8000
  # Coordinates liturgy-agent and homily-agent via A2A protocol
  chat-orchestrator:
    image: ghcr.io/giacomobartoloni/prete-a-porter-chat-orchestrator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: packages/chat-orchestrator/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - A2A_LITURGY_URL=http://liturgy-agent:8001
      - A2A_HOMILY_URL=http://homily-agent:8002
      - WS_JWT_SECRET=${WS_JWT_SECRET}
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY}
      - A2A_BASIC_AUTH_USERNAME=${A2A_BASIC_AUTH_USERNAME:?A2A_BASIC_AUTH_USERNAME is required}
      - A2A_BASIC_AUTH_PASSWORD=${A2A_BASIC_AUTH_PASSWORD:?A2A_BASIC_AUTH_PASSWORD is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - CHAT_REQUEST_TIMEOUT_SECONDS=${CHAT_REQUEST_TIMEOUT_SECONDS:-180}
    depends_on:
      liturgy-agent:
        condition: service_healthy
      homily-agent:
        condition: service_healthy
    networks:
      - preteaporter-network
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8000/health', timeout=5.0).status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    volumes:
      - ./data:/app/data

  # Liturgy Agent - HTTP A2A server on port 8001
  # Provides liturgical content generation and retrieval
  liturgy-agent:
    image: ghcr.io/giacomobartoloni/prete-a-porter-liturgy-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: packages/liturgy-agent/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - AGENT_CONTRACT_PATH=/app/contracts/liturgy-agent-contract.json
      - AGENT_URL=http://liturgy-agent:8001
      - A2A_BASIC_AUTH_USERNAME=${A2A_BASIC_AUTH_USERNAME:?A2A_BASIC_AUTH_USERNAME is required}
      - A2A_BASIC_AUTH_PASSWORD=${A2A_BASIC_AUTH_PASSWORD:?A2A_BASIC_AUTH_PASSWORD is required}
    networks:
      - preteaporter-network
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8001/health', timeout=5.0).status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 10
    volumes:
      - ./data:/app/data

  # Homily Agent - HTTP A2A server on port 8002
  # Provides homily content generation and spiritual guidance
  homily-agent:
    image: ghcr.io/giacomobartoloni/prete-a-porter-homily-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: packages/homily-agent/Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env
    environment:
      - AGENT_CONTRACT_PATH=/app/contracts/homily-agent-contract.json
      - AGENT_URL=http://homily-agent:8002
      - A2A_BASIC_AUTH_USERNAME=${A2A_BASIC_AUTH_USERNAME:?A2A_BASIC_AUTH_USERNAME is required}
      - A2A_BASIC_AUTH_PASSWORD=${A2A_BASIC_AUTH_PASSWORD:?A2A_BASIC_AUTH_PASSWORD is required}
    networks:
      - preteaporter-network
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8002/health', timeout=5.0).status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 10
    volumes:
      # RAG corpus + ONNX embedding model cache (populated by the rag-ingest service)
      - ./data/chroma_db:/app/packages/homily-agent/data/chroma_db
      - ./data/chroma_cache:/root/.cache

  # RAG corpus ingestion — one-off, not started by `docker compose up` (profile: tools)
  #   mkdir -p data/chroma_db data/chroma_cache
  #   docker compose build homily-agent
  #   docker compose run --rm rag-ingest --reset
  # Parsers (bs4/lxml/pymupdf) live in the `ml` extra and are installed on the fly;
  # embeddings use the same ONNX MiniLM function as the homily-agent at query time.
  rag-ingest:
    profiles: ["tools"]
    image: ghcr.io/giacomobartoloni/prete-a-porter-homily-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: packages/homily-agent/Dockerfile
    env_file:
      - .env
    entrypoint:
      - sh
      - -c
      - >-
        uv pip install --python .venv/bin/python beautifulsoup4 lxml pymupdf &&
        .venv/bin/python scripts/ingest_corpus.py "$@"
      - sh
    volumes:
      - ./support:/app/support:ro
      - ./data/chroma_db:/app/packages/homily-agent/data/chroma_db
      - ./data/chroma_cache:/root/.cache
    networks:
      - preteaporter-network

  # Frontend - Next.js Web UI on port 3000
  # Chat interface connecting to chat-orchestrator via WebSocket
  frontend:
    image: ghcr.io/giacomobartoloni/prete-a-porter-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - WS_URL=${WS_URL:-ws://chat-orchestrator:8000/ws/chat}
      - ORCHESTRATOR_URL=http://chat-orchestrator:8000
      - WS_JWT_SECRET=${WS_JWT_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-https://chat.prete-a-porter.dev}
      - DATABASE_URL=file:../data/dev.db
    depends_on:
      chat-orchestrator:
        condition: service_healthy
    networks:
      - preteaporter-network
    volumes:
      - frontend-db:/app/data

  # Caddy - Reverse proxy with automatic TLS (Let's Encrypt)
  # Routes: /ws/* → chat-orchestrator, /* → frontend
  # Ports 80/443 must be open in the Hetzner cloud firewall
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - chat-orchestrator
      - openwebui
    networks:
      preteaporter-network:
        # The app makes self-referential requests to its public URL (next-auth middleware
        # session checks, next-intl rewrites). Resolve that name to Caddy inside the
        # network so those calls complete instead of leaving the bridge and failing.
        aliases:
          - chat.prete-a-porter.dev
    restart: unless-stopped

  # OpenWebUI — chat frontend for the chat-orchestrator's OpenAI-compatible API
  openwebui:
    # v0.11.x is the first minor release line that reads DEFAULT_INTERFACE_SETTINGS;
    # v0.10.2 silently ignored it. Pin the latest 0.11 patch (security/access-control
    # fixes in v0.11.4); bumping past 0.11 requires re-checking the keys below.
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: openwebui
    ports:
      # Loopback only: public traffic goes through Caddy. Host port 3001 while
      # the Next.js frontend still owns 3000; after cutover, move to 127.0.0.1:3000.
      - "127.0.0.1:3001:8080"
    environment:
      - OPENAI_API_BASE_URL=http://chat-orchestrator:8000/v1
      - OPENAI_API_KEY=${ORCHESTRATOR_API_KEY}
      - ENABLE_FORWARD_USER_INFO_HEADERS=True
      # Per-connection custom header: OpenWebUI substitutes {{CHAT_ID}} per request.
      - OPENAI_API_CONFIGS={"prete-a-porter":{"headers":{"X-OpenWebUI-Chat-Id":"{{CHAT_ID}}"}}}
      # Disable every auxiliary task that would otherwise hit the orchestrator.
      - ENABLE_TITLE_GENERATION=False
      - ENABLE_TAGS_GENERATION=False
      - ENABLE_FOLLOW_UP_GENERATION=False
      - ENABLE_AUTOCOMPLETE_GENERATION=False
      - ENABLE_RETRIEVAL_QUERY_GENERATION=False
      - ENABLE_SEARCH_QUERY_GENERATION=False
      - ENABLE_IMAGE_PROMPT_GENERATION=False
      - ENABLE_CONTEXT_COMPACTION=False
      # Interface defaults, aligned with the legacy Next.js frontend where the
      # supported keys allow it: wide content column, no chat bubbles (the live
      # legacy renderer draws assistant text as bare markdown), markdown for the
      # assistant only (user text was rendered as plain pre-wrap text), and no
      # background generation of titles, tags or follow-ups.
      #
      # COLOURS ARE NOT CONFIGURABLE. OpenWebUI exposes no supported way to
      # override its palette: custom theming is an enterprise feature and the
      # image carries no custom-CSS hook. The legacy warm-liturgical light
      # palette and obsidian dark palette (globals.css) cannot be reproduced
      # here. Do not patch the compiled assets to force them; see
      # docs/verification-levels.md for why that class of change is avoided.
      #
      # fontFamily names a font that must be installed on each user's machine.
      # Inter is not a macOS system font, so users without it silently fall back
      # to the default face. The legacy UI also used Playfair Display for
      # headings and JetBrains Mono for code; only one family is settable.
      - 'DEFAULT_INTERFACE_SETTINGS={"widescreenMode":false,"chatBubble":true,"chatHoverPreview":true,"showFloatingActionButtons":false,"chatDirection":"LTR","landingPageMode":"chat","renderMarkdownInAssistantMessages":true,"renderMarkdownInUserMessages":false,"renderMarkdownInPreviews":true,"chatFadeStreamingText":false,"collapseCodeBlocks":false,"expandDetails":false,"title":{"auto":true},"autoFollowUps":true,"autoTags":false,"keepFollowUpPrompts":false,"enableMessageQueue":false,"temporaryChatByDefault":false,"showChangelog":false,"showUpdateToast":false,"showUsername":false,"copyFormatted":true,"highContrastMode":false,"scrollOnResponseGeneration":true,"showChatTitleInTab":true,"fontFamily":"Inter"}'
      - DEFAULT_LOCALE=it-IT
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - CHROMA_ENABLED=False
      - CHROMADB_ENABLED=False
      - RAG_EMBEDDING_ENGINE=
      - RAG_EMBEDDING_MODEL=
    depends_on:
      - chat-orchestrator
    networks:
      - preteaporter-network
    volumes:
      - openwebui_data:/app/backend/data

  # A2A Inspector - Web UI for testing agents via standard A2A protocol
  # Access at http://localhost:8080, then enter http://liturgy-agent:8001
  # Port 8080 is blocked by Hetzner firewall in production
  a2a-inspector:
    image: a2a-inspector
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - preteaporter-network

volumes:
  openwebui_data:
  frontend-db:
  caddy_data:
  caddy_config:

networks:
  preteaporter-network:
    driver: bridge