name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a2a-protocol package
        working-directory: packages/a2a-protocol
        run: uv sync

      - name: Install liturgy-agent package
        working-directory: packages/liturgy-agent
        run: uv sync

      - name: Install homily-agent package
        working-directory: packages/homily-agent
        run: uv sync

      - name: Install chat-orchestrator package
        working-directory: packages/chat-orchestrator
        run: uv sync

      - name: Install contract test dependencies
        working-directory: contracts
        run: uv sync

      - name: Start fixture Evangelizo upstream
        run: |
          python contracts/scripts/fixture_evangelizo_server.py --host 127.0.0.1 --port 18080 &
          echo "FIXTURE_PID=$!" >> $GITHUB_ENV

      - name: Wait for fixture upstream
        run: |
          python contracts/scripts/wait_for_health.py \
            http://127.0.0.1:18080/health \
            --attempts 30 \
            --sleep 1

      - name: Start liturgy agent
        working-directory: packages/liturgy-agent
        run: |
          uv run python -m liturgy_agent.main --port 8001 &
          echo "LITURGY_PID=$!" >> $GITHUB_ENV
        env:
          TEST_MODE: true
          DATABASE_PATH: /tmp/liturgy_cache.db
          EVANGELIZO_BASE_URL: http://127.0.0.1:18080
          A2A_BASIC_AUTH_USERNAME: a2a-test
          A2A_BASIC_AUTH_PASSWORD: a2a-test-secret

      - name: Start homily agent
        working-directory: packages/homily-agent
        run: |
          uv run python -m homily_agent.main --port 8002 &
          echo "HOMILY_PID=$!" >> $GITHUB_ENV
        env:
          TEST_MODE: true
          A2A_BASIC_AUTH_USERNAME: a2a-test
          A2A_BASIC_AUTH_PASSWORD: a2a-test-secret

      - name: Start chat orchestrator
        working-directory: packages/chat-orchestrator
        run: |
          uv run python -m chat_orchestrator.main &
          echo "CHAT_PID=$!" >> $GITHUB_ENV
        env:
          TEST_MODE: true
          DATABASE_PATH: /tmp/chat_orchestrator.db
          WS_JWT_SECRET: test-jwt-secret-for-ci-32-bytes-minimum
          ORCHESTRATOR_API_KEY: test-orchestrator-key
          RATE_LIMIT_DB_PATH: /tmp/rate_limiter.db
          RATE_LIMIT_MESSAGES_PER_HOUR: "3"
          RATE_LIMIT_MESSAGES_PER_DAY: "100"
          CHAT_REQUEST_TIMEOUT_SECONDS: "60"
          A2A_LITURGY_URL: http://localhost:8001
          A2A_HOMILY_URL: http://localhost:8002
          A2A_BASIC_AUTH_USERNAME: a2a-test
          A2A_BASIC_AUTH_PASSWORD: a2a-test-secret
          CORS_ORIGINS: http://localhost:3000

      - name: Wait for agents to be ready
        run: |
          python contracts/scripts/wait_for_health.py \
            http://localhost:8001/health \
            http://localhost:8002/health \
            http://localhost:8000/health \
            --attempts 30 \
            --sleep 1

      - name: Run contract tests
        working-directory: contracts
        run: uv run pytest tests/ -v --no-docker --junit-xml=test-results.xml
        env:
          A2A_LITURGY_URL: http://localhost:8001
          A2A_HOMILY_URL: http://localhost:8002
          A2A_BASIC_AUTH_USERNAME: a2a-test
          A2A_BASIC_AUTH_PASSWORD: a2a-test-secret
          WS_JWT_SECRET: test-jwt-secret-for-ci-32-bytes-minimum
          ORCHESTRATOR_API_KEY: test-orchestrator-key
          RATE_LIMIT_MESSAGES_PER_HOUR: "3"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-results
          path: contracts/test-results.xml
          retention-days: 30

      - name: Stop agents
        if: always()
        run: |
          if [ -n "$LITURGY_PID" ]; then
            kill $LITURGY_PID 2>/dev/null || true
          fi
          if [ -n "$HOMILY_PID" ]; then
            kill $HOMILY_PID 2>/dev/null || true
          fi
          if [ -n "$CHAT_PID" ]; then
            kill $CHAT_PID 2>/dev/null || true
          fi
          if [ -n "$FIXTURE_PID" ]; then
            kill $FIXTURE_PID 2>/dev/null || true
          fi
