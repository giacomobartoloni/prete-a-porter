name: E2E User Journeys (Testcontainers)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chat-user-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E runner
        run: python -m pip install -r tests/e2e/requirements.txt

      - name: Docker Compose version
        run: docker compose version

      - name: Run containerized user journey tests
        run: python -m pytest tests/e2e/test_chat_user_journeys.py -v --maxfail=1
