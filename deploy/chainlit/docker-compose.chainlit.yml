# Chainlit native UI (prete-chat) — additive overlay.
#
# The OpenAI-compatible surface, OpenWebUI, LibreChat, the legacy Next.js
# frontend and both agents keep running. Start it with:
#
#   docker compose -f docker-compose.yml -f deploy/chainlit/docker-compose.chainlit.yml up -d --build
#
# Native UI: http://localhost:3003
#
# This is the POC stage: no database and no authentication yet, so the service
# is reachable only on loopback. The Postgres data layer joins this file in the
# persistence phase.

services:
  prete-chat:
    image: ghcr.io/giacomobartoloni/prete-a-porter-prete-chat:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: packages/prete-chat/Dockerfile
    container_name: prete-chat
    ports:
      # Host port 3003: 3000 is the legacy frontend, 3001 OpenWebUI, 3002 LibreChat.
      - "127.0.0.1:3003:8000"
    env_file:
      - .env
    environment:
      # The repository .env carries the legacy frontend's Prisma URL (sqlite,
      # `file:`). Chainlit auto-enables its SQLAlchemy data layer whenever
      # DATABASE_URL is set, so this service overrides it with the PostgreSQL
      # URL of its own database (see deploy/chainlit/README.md).
      - DATABASE_URL=postgresql+asyncpg://chainlit:${PRETE_CHAT_DB_PASSWORD}@prete-chat-db:5432/chainlit
      # Signs the session cookie; logins fail without it (config.validate).
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET}
      # Public URL for cookie/redirect correctness behind the proxy.
      - CHAINLIT_URL=${CHAINLIT_URL:-http://localhost:3003}
      # The in-process core calls the agents directly, like the orchestrator does.
      - A2A_LITURGY_URL=http://liturgy-agent:8001
      - A2A_HOMILY_URL=http://homily-agent:8002
      - A2A_BASIC_AUTH_USERNAME=${A2A_BASIC_AUTH_USERNAME}
      - A2A_BASIC_AUTH_PASSWORD=${A2A_BASIC_AUTH_PASSWORD}
      - CHAT_REQUEST_TIMEOUT_SECONDS=${CHAT_REQUEST_TIMEOUT_SECONDS:-180}
      # Per-shell quota: this container's own SQLite file, never shared with
      # the orchestrator container.
      - RATE_LIMIT_DB_PATH=/app/data/rate_limiter.db
      - RATE_LIMIT_MESSAGES_PER_HOUR=${RATE_LIMIT_MESSAGES_PER_HOUR:-5}
      - RATE_LIMIT_MESSAGES_PER_DAY=${RATE_LIMIT_MESSAGES_PER_DAY:-20}
    volumes:
      - prete-chat-data:/app/data
    depends_on:
      prete-chat-db:
        condition: service_healthy
      liturgy-agent:
        condition: service_healthy
      homily-agent:
        condition: service_healthy
    networks:
      - preteaporter-network
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8000/health', timeout=5.0).status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # PostgreSQL for Chainlit's data layer: users, threads, steps, elements,
  # feedbacks. First boot applies deploy/chainlit/init.sql; upgrades follow the
  # procedure in deploy/chainlit/README.md. No published port: reachable only
  # from the internal bridge network. Pinned minor, like LibreChat's image.
  prete-chat-db:
    image: postgres:17.6-alpine
    container_name: prete-chat-db
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    environment:
      - POSTGRES_USER=chainlit
      - POSTGRES_PASSWORD=${PRETE_CHAT_DB_PASSWORD}
      - POSTGRES_DB=chainlit
    volumes:
      - prete-chat-db-data:/var/lib/postgresql/data
      - ./deploy/chainlit/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - preteaporter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  prete-chat-data:
  prete-chat-db-data:
