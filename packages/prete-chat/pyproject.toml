[project]
name = "prete-chat"
version = "0.1.0"
description = "Chainlit native conversational UI for Prete-a-porter"
readme = "README.md"
authors = [{name = "Prete-a-porter Contributors", email = "contributors@preteaporter.local"}]
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
    "chainlit==2.12.0",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.30",
    "bcrypt>=4.1",
    "chat-orchestrator",
    "a2a-protocol",
]

[tool.uv.sources]
chat-orchestrator = { path = "../chat-orchestrator", editable = true }
a2a-protocol = { path = "../a2a-protocol", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
